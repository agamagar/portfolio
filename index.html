<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site opens in dark in every build (5 Oct: deployed; 7 Oct: dev too). The
         class is set before first paint so there is no light flash. A visitor's own
         light pick (lib/autoTheme.js, "theme-manual") still wins until the next dusk or dawn. -->
    <script>
      {
        var pick = null;
        try { pick = JSON.parse(localStorage.getItem("theme-manual") || "null"); } catch (e) {}
        if (!pick || pick.theme !== "light") document.documentElement.classList.add("dark");
      }
    </script>
    <!-- 11 Oct (mv3n1dcl): the page colour before any stylesheet lands. The dark
         class above was set before first paint, but its background lives in
         index.css, which in dev arrives with the JS: every open flashed white for
         ~0.3 s. Same values as the --bg tokens. -->
    <style>html { background: #fff; } html.dark { background: #0e0e11; color-scheme: dark; }</style>
    <!-- The serif and heading font picks (lib/serifFont.js, keys "serif-font" and "hero-font") are
         applied before first paint, and their Google fonts requested here only when not Newsreader. -->
    <script>
      try {
        var S = { corben: ["Corben:wght@400;700", "Corben"], bitter: ["Bitter:ital,wght@0,400..700;1,400..500", "Bitter"], brawler: ["Brawler:wght@400;700", "Brawler"] };
        var R = document.documentElement, pre = false;
        [["serif-font", "--font-serif", "serif"], ["hero-font", "--font-hero", "heroFont"]].forEach(function (k) {
          var sp = localStorage.getItem(k[0]);
          if (sp !== "newsreader" && !S[sp]) return;
          R.style.setProperty(k[1], '"' + (S[sp] ? S[sp][1] : "Newsreader") + '", Georgia, "Times New Roman", serif');
          R.dataset[k[2]] = sp;
          if (!S[sp] || document.getElementById("serif-" + sp)) return;
          var h;
          if (!pre) { pre = true;
            h = document.createElement("link"); h.rel = "preconnect"; h.href = "https://fonts.googleapis.com"; document.head.appendChild(h);
            h = document.createElement("link"); h.rel = "preconnect"; h.href = "https://fonts.gstatic.com"; h.crossOrigin = ""; document.head.appendChild(h); }
          h = document.createElement("link"); h.id = "serif-" + sp; h.rel = "stylesheet"; h.href = "https://fonts.googleapis.com/css2?family=" + S[sp][0] + "&display=swap"; document.head.appendChild(h);
        });
      } catch (e) {}
    </script>
    <title>Agam Agarwal</title>
    <!-- The tab icon's FIRST FRAME of its run (red sphere, then yellow pyramid, blue cube, the
         three.js face: src/lib/favicon3d.js), pre-rendered, so nothing shows the old face before
         the animation starts or when it cannot run (reduced motion, Safari, no WebGL2).
         favicon3d keeps ONE rel="icon" link and holds its last frame if it ever stops. -->
    <link rel="icon" href="/favicon-sphere.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Google+Sans+Flex&family=Google+Sans+Code:wght@400;500&family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Onest:wght@400;500;600;700&family=Playwrite+US+Trad&display=swap"
      rel="stylesheet"
    />
    <!-- 28 Sep (mukpz799): Material Symbols Rounded, subset to the icons the
         Scheduled Delivery timeline bullets use (icon_names keeps it small) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&icon_names=analytics,assignment_return,calendar_today,campaign,check_circle,cloud_off,edit_note,engineering,event_busy,forum,grid_view,groups,handshake,help,info,local_shipping,map,person,rocket_launch,rule,science,sentiment_satisfied,sync,trending_up&display=block" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
