  <head>
    <meta charset="UTF-8" />

    <title>Agam Agarwal</title>
    <!-- The site had no icon of any kind, so every tab showed the browser's blank
         document glyph. This is the face redrawn at 32px (public/favicon.svg),
         not exported down to it: the illustration's 3.18 and 4.18 unit strokes
         disappear at that size. Its ink follows the browser chrome's theme, not
         the page's. TODO: a raster apple-touch-icon, which needs a rasterizer
         this repo does not currently have. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Google+Sans+Flex&family=Google+Sans+Code:wght@400;500&family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Onest:wght@400;500;600;700&family=Playwrite+US+Trad&display=swap"
      rel="stylesheet"
    />
    <!-- 28 Sep (mukpz799): Material Symbols Rounded, subset to the icons the
         Scheduled Delivery timeline bullets use (icon_names keeps it small) -->
