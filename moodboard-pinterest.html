const canvas=document.getElementById('canvas');
const th=document.createElement('div');th.className='thesis';th.style.left=X[0]+'px';th.style.top=Y[0]+'px';
th.innerHTML=`<div class="tagl">The synthesis · your picks, expanded</div>
  <h1>The <em>Warm</em> Machine</h1>
  <p>A generative system — disciplined like Swiss print, calm like Japanese industrial design, voiced in a lush editorial serif, warmed by analog grain. Awe from a thing that behaves like matter; curiosity from a structure you're invited to read and perturb.</p>
  <div class="legend"><b>★</b> grown from your 7 picks &nbsp;·&nbsp; <i>exploration</i> = adjacent territory pulled to widen the world<br>17 directions · ~175 real pins from Pinterest · click any to open the source</div>`;
canvas.appendChild(th);

groups.forEach(g=>{
  const b=document.createElement('div');b.className='block';b.dataset.gid=g.id;
  b.style.left=g.x+'px';b.style.top=g.y+'px';
  const pins=g.pins.map(p=>`<a class="pin" href="https://www.pinterest.com/pin/${p[1]}/" target="_blank" rel="noopener">
      <img decoding="async" referrerpolicy="no-referrer" src="https://i.pinimg.com/736x/${p[0]}.jpg" alt="${g.id} pin"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://i.pinimg.com/474x/${p[0]}.jpg';}else{this.parentNode.classList.add('failed');}">
      <span class="tag">Open pin ↗</span></a>`).join('');
  b.innerHTML=`<div class="gn">Cluster ${g.n}</div><div class="gt">${g.title}</div>
    <div class="gd">${g.d}</div><div class="seeds${g.exp?' exp':''}">${g.seeds}</div>
    <div class="masonry">${pins}</div>`;
  canvas.appendChild(b);
});

const stage=document.getElementById('stage');
let tx=60, ty=70, scale=.5, isDown=false, sx, sy, moved=false;
function apply(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fitW(){scale=Math.max(.2,Math.min(.62,(innerWidth-80)/2700));tx=(innerWidth-2700*scale)/2;ty=70;apply();}
fitW();
stage.addEventListener('pointerdown',e=>{isDown=true;moved=false;sx=e.clientX-tx;sy=e.clientY-ty;stage.classList.add('drag');});
window.addEventListener('pointermove',e=>{if(!isDown)return;tx=e.clientX-sx;ty=e.clientY-sy;moved=true;apply();});
window.addEventListener('pointerup',()=>{isDown=false;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const ns=Math.min(1.7,Math.max(.12,scale*f));
  const rx=(e.clientX-tx)/scale,ry=(e.clientY-ty)/scale;scale=ns;tx=e.clientX-rx*scale;ty=e.clientY-ry*scale;apply();
  document.getElementById('hint').style.opacity=0;},{passive:false});

function flyTo(gid){const g=groups.find(x=>x.id===gid);scale=.8;
  tx=innerWidth/2-(g.x+280)*scale;ty=140-g.y*scale;
  canvas.style.transition='transform .8s cubic-bezier(.22,.61,.36,1)';apply();
  setTimeout(()=>canvas.style.transition='',850);document.getElementById('hint').style.opacity=0;}

const hud=document.getElementById('hud');
hud.innerHTML=`<button data-fly="top">◎ Fit width</button>`+groups.map(g=>`<button data-fly="${g.id}">${g.n} ${g.title.replace(/<[^>]+>/g,'').replace('&amp;','&')}</button>`).join('');
hud.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.dataset.fly==='top'?fitW():flyTo(b.dataset.fly);});
document.getElementById('zoom').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=+b.dataset.z;
  if(z===0){fitW();return;}const f=z>0?1.18:1/1.18;const ns=Math.min(1.7,Math.max(.12,scale*f));
  const cx=innerWidth/2,cy=innerHeight/2,rx=(cx-tx)/scale,ry=(cy-ty)/scale;scale=ns;tx=cx-rx*scale;ty=cy-ry*scale;apply();});
canvas.addEventListener('click',e=>{if(moved)e.preventDefault();},true);
window.addEventListener('resize',fitW);
setTimeout(()=>document.getElementById('hint').style.opacity=0,5500);
</script>
