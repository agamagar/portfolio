<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The site's face, REDRAWN at 32px rather than exported down to it.

    The source illustration (src/faceMorph.js, Figma node 1724-23069) is built
    from 3.18 and 4.18 unit strokes on a 132x160 box. Scaled to 32px those land
    at roughly 0.8px and vanish into grey mush, which is what a plain export of
    this drawing looks like in a tab. So the strokes here are re-weighted to 2.2
    and 1.8, the nose, brow, inner-ear line and the eyebrow flick are dropped
    entirely, and what survives is the only thing that reads at this size: the
    silhouette, the swoosh, two eyes and the mouth.

    The ink follows the tab strip, not the page: browsers render this against
    their own chrome, so prefers-color-scheme here is asking about the BROWSER's
    theme. That is correct and is what the media query is for.
  -->
  <style>
    .ink { stroke: #111111; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0ece4; }
      .solid { fill: #f0ece4; }
    }
  </style>

  <!-- the hair swoosh, the one solid mass in the drawing -->
  <path class="solid"
        d="M11.6 8.4C13.4 4.2 19.4 2.4 22.4 4.6c2.4 1.8 1.2 4.6-1.8 6.2-2.6 1.4-6.6 1.2-9-2.4Z" />

  <!-- head -->
  <path class="ink" stroke-width="2.2"
        d="M11.3 8.1C13.7 5.6 20 5.2 23 8.8c2.3 2.8 2.6 8.6 2.2 12.4-.4 4.2-3.3 6.6-8 6.5-4.8-.1-7.2-2.8-7.7-7-.3-2.6-.5-5.8-.4-8" />

  <!-- ear -->
  <path class="ink" stroke-width="1.8"
        d="M9.6 14.2c-1.8-.9-3.6.6-3.1 3 .4 2.1 2 3.1 3.5 2.8" />

  <!-- eyes -->
  <circle class="solid" cx="14.4" cy="15.6" r="1.6" />
  <circle class="solid" cx="21.4" cy="14.6" r="1.6" />

  <!-- mouth -->
  <path class="ink" stroke-width="1.8"
        d="M16.9 20.7c0 1.6 1.2 2.9 3.1 2.4" />
</svg>
