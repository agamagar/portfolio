<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Appendix: more signals from the inbox</title>
<style>
  :root{
    --bg:#0c0d10; --panel:#131519; --panel-2:#171a1f; --line:#242830; --line-2:#2d323c;
    --ink:#f4f5f7; --ink-2:#a7adba; --ink-3:#6b7280;
    --accent:#3987e5; --train:#199e70;
    --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9; --s6:#e66767;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
    --serif:"Newsreader","Iowan Old Style",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1100px 640px at 82% -6%, rgba(57,135,229,.15), transparent 60%),
      radial-gradient(820px 560px at 4% 4%, rgba(201,133,0,.08), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(24px,5vw,72px) clamp(18px,4vw,40px) 120px}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6.6vw,70px);line-height:1.03;letter-spacing:-.03em;margin:0 0 20px}
  h1 em{font-style:italic;color:var(--ink-2)}
  .lede{font-size:clamp(16px,2.1vw,19px);color:var(--ink-2);max-width:62ch;margin:0 0 8px}
  .lede b{color:var(--ink);font-weight:600}
  section{margin-top:clamp(52px,8vw,104px)}
  .sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .sec-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(23px,3.4vw,33px);letter-spacing:-.02em;margin:0}
  .idx{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em}
  .sub{color:var(--ink-2);max-width:66ch;margin:0 0 24px;font-size:15.5px}
  .sub b{color:var(--ink)}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,30px);corner-shape:squircle}
  svg{display:block;width:100%;height:auto;overflow:visible}

  /* odometer */
  .odo{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
  @media(max-width:720px){.odo{grid-template-columns:1fr}}
  .odonum{font-family:var(--serif);font-size:clamp(44px,8vw,76px);line-height:.9;letter-spacing:-.03em}
  .odonum small{font-size:.32em;color:var(--ink-3);font-family:var(--mono);letter-spacing:.05em;display:block;margin-top:8px}
  .facts{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .fact{display:flex;gap:12px;align-items:baseline}
  .fact .fn{font-family:var(--serif);font-size:26px;color:var(--accent);min-width:64px}
  .fact .fl{font-size:14px;color:var(--ink-2)}
  .rk{display:grid;grid-template-columns:96px 1fr auto;gap:10px 12px;align-items:center;margin-top:6px}
  .rk .k{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right}
  .rtrack{height:20px;background:#0e1014;border:1px solid var(--line);border-radius:7px;overflow:hidden;corner-shape:squircle}
  .rfill{height:100%;width:0;background:var(--accent);border-radius:6px 3px 3px 6px;transition:width 1s cubic-bezier(.5,0,.15,1)}
  .rk .v{font-family:var(--mono);font-size:12px;color:var(--ink)}

  /* sell language */
  .wordbars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px}
  @media(max-width:620px){.wordbars{grid-template-columns:1fr}}
  .wb{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center}
  .wb .w{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
  .wtrack{height:18px;background:#0e1014;border:1px solid var(--line);border-radius:6px;overflow:hidden;corner-shape:squircle}
  .wfill{height:100%;width:0;background:var(--s3);border-radius:5px 2px 2px 5px;transition:width .9s cubic-bezier(.5,0,.15,1)}
  .wb .n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .emoji{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .em{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:52px}
  .em .g{font-size:30px;line-height:1;filter:saturate(1.05)}
  .em .c{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

  /* mini bars (season) */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .mtitle{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
  .bset{display:grid;align-items:end;gap:5px;height:130px}
  .bar{border-radius:5px 5px 2px 2px;height:0;transition:height .9s cubic-bezier(.5,0,.15,1);corner-shape:squircle;background:var(--train)}
  .bar.peak{background:var(--accent)}
  .ticks{display:grid;gap:5px;margin-top:7px}
  .tk{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);text-align:center}

  /* waves */
  .wave-wrap{overflow-x:auto}
  .waves{display:grid;align-items:end;gap:3px;height:150px;min-width:520px}
  .wv{background:var(--accent);border-radius:3px 3px 0 0;height:0;transition:height .8s cubic-bezier(.5,0,.15,1);corner-shape:squircle;opacity:.85}
  .wv.peak{opacity:1;box-shadow:0 0 10px rgba(57,135,229,.5)}
  .waxis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:8px;min-width:520px}

  /* intensity */
  .intens{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;align-items:end;height:220px}
  .icol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:7px}
  .ibar{width:100%;max-width:52px;background:linear-gradient(180deg,var(--s3),#9a6500);border-radius:7px 7px 3px 3px;height:0;transition:height 1s cubic-bezier(.5,0,.15,1);corner-shape:squircle}
  .in{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
  .iy{font-family:var(--mono);font-size:10px;color:var(--ink-3)}

  .foot{margin-top:104px;padding-top:32px;border-top:1px solid var(--line);color:var(--ink-3);font-size:14px;max-width:72ch}
  .foot .big{font-family:var(--serif);font-size:clamp(20px,3vw,26px);color:var(--ink);font-style:italic;line-height:1.35;margin:0 0 16px;letter-spacing:-.01em}
  .foot b{color:var(--ink-2)} .mono{font-family:var(--mono)}
  .loading{color:var(--ink-3);font-family:var(--mono);font-size:13px;padding:40px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">reading the inbox...</div></div>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){grow(e.target);io.unobserve(e.target)}}),{threshold:.2});
fetch("viz3.json").then(r=>r.json()).then(render).catch(()=>{document.getElementById("app").innerHTML='<div class="loading">could not load viz3.json - serve over http.</div>';});
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;}

function render(D){
  const app=document.getElementById("app");app.innerHTML="";
  app.append(el(`<div>
    <p class="kick">Away agent &middot; appendix &middot; the smaller tells</p>
    <h1>Everything else<br><em>it noticed.</em></h1>
    <p class="lede">A last handful of readings from the same inbox: how far you have flown, the exact words used to sell you a seat, and the rhythm your trips actually keep.</p>
  </div>`));

  /* 01 odometer */
  const o=D.odometer, C=2*Math.PI*100, dash=o.aroundEarth*C;
  const s1=el(`<section><div class="sec-head"><span class="idx">01</span><h2>The odometer</h2></div>
    <p class="sub">Straight-line distance across the flights that carry a route. Not exhaustive, but already a fair chunk of the planet.</p>
    <div class="card"><div class="odo">
      <div style="text-align:center">
        <svg viewBox="0 0 240 240" style="max-width:240px;margin:0 auto">
          <circle cx="120" cy="120" r="100" fill="none" stroke="var(--line)" stroke-width="14"/>
          <circle cx="120" cy="120" r="100" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" transform="rotate(-90 120 120)" style="opacity:0;transition:opacity .8s" id="earthring"/>
          <text x="120" y="112" text-anchor="middle" font-family="var(--serif)" font-size="34" fill="var(--ink)">${o.aroundEarth}x</text>
          <text x="120" y="136" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink-3)">around Earth</text>
        </svg>
      </div>
      <div>
        <div class="odonum">${o.km.toLocaleString()}<small>KILOMETRES FLOWN &middot; ${o.legs} ROUTED FLIGHTS</small></div>
        <div class="facts">
          <div class="fact"><span class="fn">${o.toMoonPct}%</span><span class="fl">of the way to the Moon</span></div>
          <div class="fact"><span class="fn">${o.delBlrEquiv}x</span><span class="fl">the Delhi&ndash;Bengaluru hop, back to back</span></div>
        </div>
        <div class="rk" id="rk" style="margin-top:20px"></div>
      </div>
    </div></div></section>`);
  app.append(s1);
  const rk=s1.querySelector("#rk"), rmax=Math.max(...o.routeKm.map(r=>r[1]));
  o.routeKm.forEach(([k,v])=>rk.append(el(`<div style="display:contents"><div class="k">${k}</div><div class="rtrack"><div class="rfill" data-w="${(v/rmax*100).toFixed(0)}"></div></div><div class="v">${v.toLocaleString()} km</div></div>`)));
  setTimeout(()=>{const r=s1.querySelector("#earthring");if(r)r.style.opacity=1;},200);
  io.observe(s1);

  /* 02 sell language */
  const w=D.sell.words, wmax=w[0][1];
  const s2=el(`<section><div class="sec-head"><span class="idx">02</span><h2>The language of the sell</h2></div>
    <p class="sub"><b>${D.sell.promoCount}</b> promotional emails came in over the years. Strip them down to their favourite words and this is the vocabulary of wanting your attention.</p>
    <div class="card">
      <div class="wordbars" id="words"></div>
      <div class="emoji" id="emoji"></div>
    </div></section>`);
  app.append(s2);
  const wb=s2.querySelector("#words");
  w.forEach(([word,n])=>wb.append(el(`<div class="wb"><div class="w">${word}</div><div class="wtrack"><div class="wfill" data-w="${(n/wmax*100).toFixed(0)}"></div></div><div class="n">${n}</div></div>`)));
  const em=s2.querySelector("#emoji");
  D.sell.emoji.forEach(([g,c])=>em.append(el(`<div class="em"><div class="g">${g}</div><div class="c">${c}</div></div>`)));
  io.observe(s2);

  /* 03 when you actually travel */
  const M=["J","F","M","A","M","J","J","A","S","O","N","D"], DW=["Su","Mo","Tu","We","Th","Fr","Sa"];
  const mmax=Math.max(...D.season.tmoy), dmax=Math.max(...D.season.tdow);
  const s3=el(`<section><div class="sec-head"><span class="idx">03</span><h2>When you actually travel</h2></div>
    <p class="sub">Not when the mail arrived &mdash; the real travel dates on ${D.season.n} trips. The year bends toward <b>late summer</b>, and the week toward the <b>weekend</b>.</p>
    <div class="card"><div class="two">
      <div><div class="mtitle">By month</div><div class="bset" id="tmoy" style="grid-template-columns:repeat(12,1fr)"></div><div class="ticks" id="tmoyt" style="grid-template-columns:repeat(12,1fr)"></div></div>
      <div><div class="mtitle">By weekday</div><div class="bset" id="tdow" style="grid-template-columns:repeat(7,1fr)"></div><div class="ticks" id="tdowt" style="grid-template-columns:repeat(7,1fr)"></div></div>
    </div></div></section>`);
  app.append(s3);
  const tm=s3.querySelector("#tmoy"), tmt=s3.querySelector("#tmoyt");
  D.season.tmoy.forEach((v,i)=>{tm.append(el(`<div class="bar ${v===mmax?'peak':''}" data-h="${v===0?3:Math.max(6,v/mmax*100)}" title="${v}"></div>`));tmt.append(el(`<div class="tk">${M[i]}</div>`));});
  const td=s3.querySelector("#tdow"), tdt=s3.querySelector("#tdowt");
  D.season.tdow.forEach((v,i)=>{td.append(el(`<div class="bar ${v===dmax?'peak':''}" data-h="${v===0?3:Math.max(6,v/dmax*100)}" title="${v}"></div>`));tdt.append(el(`<div class="tk">${DW[i]}</div>`));});
  io.observe(s3);

  /* 04 waves */
  const qs=D.waves.quarters, qmax=D.waves.max;
  const s4=el(`<section><div class="sec-head"><span class="idx">04</span><h2>Travel comes in waves</h2></div>
    <p class="sub">Trips per quarter. Long still stretches, then bursts &mdash; life happens in clumps, and the busiest quarter alone held <b>${qmax}</b> trips.</p>
    <div class="card"><div class="wave-wrap">
      <div class="waves" id="waves" style="grid-template-columns:repeat(${qs.length},1fr)"></div>
      <div class="waxis"><span>${qs[0].q}</span><span>${qs[Math.floor(qs.length/2)].q}</span><span>${qs[qs.length-1].q}</span></div>
    </div></div></section>`);
  app.append(s4);
  const wv=s4.querySelector("#waves");
  qs.forEach(x=>wv.append(el(`<div class="wv ${x.n===qmax?'peak':''}" data-h="${x.n===0?2:Math.max(6,x.n/qmax*100)}" title="${x.q}: ${x.n}"></div>`)));
  io.observe(s4);

  /* 05 intensity */
  const it=D.intensity, imax=Math.max(...it.map(x=>x.promo));
  const s5=el(`<section><div class="sec-head"><span class="idx">05</span><h2>The more you fly, the harder they sell</h2></div>
    <p class="sub">Promotional emails per year. As the real trips picked up after 2022, the marketing didn't just follow &mdash; it <b>surged past</b>, peaking near <b>${imax}</b> in a single year.</p>
    <div class="card"><div class="intens" id="intens"></div></div></section>`);
  app.append(s5);
  const ic=s5.querySelector("#intens");
  it.forEach(x=>{const col=el(`<div class="icol"></div>`);
    col.append(el(`<div class="in">${x.promo||""}</div>`));
    col.append(el(`<div class="ibar" data-h="${x.promo===0?2:Math.max(4,x.promo/imax*100)}"></div>`));
    col.append(el(`<div class="iy">'${x.year.slice(2)}</div>`));ic.append(col);});
  io.observe(s5);

  // fallback: ensure every fill applies even where IntersectionObserver is slow
  // (headless capture, or all sections on-screen at once). rAF x2 keeps the
  // 0 -> target transition so it still animates.
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("section").forEach(grow)));

  app.append(el(`<div class="foot">
    <p class="big">The inbox is a diary you never meant to keep.</p>
    <p>Distance, taste, timing, and the exact pitch of everyone trying to sell to you &mdash; it is all just sitting there, legible to anyone who connects. Eighteen readings in, the point holds: an agent that plugs into your accounts starts the relationship already knowing you. <b>The craft is in what it chooses to do with that.</b></p>
    <p style="margin-top:20px" class="mono">Batch 3 &middot; distances are great-circle from ${D.odometer.legs} routed flights &middot; all processing local &middot; amounts + booking refs excluded.</p>
  </div>`));
}
function grow(c){
  c.querySelectorAll(".rfill,.wfill").forEach(b=>b.style.width=b.dataset.w+"%");
  c.querySelectorAll(".bar,.wv,.ibar").forEach(b=>b.style.height=b.dataset.h+"%");
}
</script>
</body>
</html>
