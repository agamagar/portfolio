<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Golden-hour airport apron at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a30"/>
      <stop offset="0.32" stop-color="#3a3155"/>
      <stop offset="0.55" stop-color="#7a5570"/>
      <stop offset="0.74" stop-color="#c97f5b"/>
      <stop offset="0.88" stop-color="#ec9f63"/>
      <stop offset="1" stop-color="#f6cb89"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.74" r="0.5">
      <stop offset="0" stop-color="#fff1d2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd79a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdca6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe0ad" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2236"/>
      <stop offset="1" stop-color="#120e1a"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf8c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0712" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1440" height="760" fill="url(#sky)"/>
  <rect width="1440" height="760" fill="url(#sun)"/>
  <!-- horizon haze -->
  <rect x="0" y="430" width="1440" height="135" fill="url(#haze)"/>

  <!-- distant terminal wall with lit windows -->
  <g fill="#241e31">
    <rect x="-20" y="486" width="980" height="80"/>
    <path d="M-20 486 L120 462 L520 462 L660 486 Z"/>
  </g>
  <g fill="#ffcf92" opacity="0.85">
    <rect x="40" y="500" width="26" height="16" rx="1"/>
    <rect x="80" y="500" width="26" height="16" rx="1"/>
    <rect x="120" y="500" width="26" height="16" rx="1"/>
    <rect x="160" y="500" width="26" height="16" rx="1"/>
    <rect x="200" y="500" width="26" height="16" rx="1"/>
    <rect x="240" y="500" width="26" height="16" rx="1"/>
    <rect x="280" y="500" width="26" height="16" rx="1"/>
    <rect x="320" y="500" width="26" height="16" rx="1"/>
    <rect x="360" y="500" width="26" height="16" rx="1"/>
    <rect x="400" y="500" width="26" height="16" rx="1"/>
    <rect x="440" y="500" width="26" height="16" rx="1"/>
    <rect x="480" y="500" width="26" height="16" rx="1"/>
  </g>

  <!-- control tower -->
  <g fill="#221c2e">
    <rect x="300" y="356" width="14" height="132"/>
    <path d="M286 360 q21 -20 42 0 l4 26 q-25 14 -50 0 Z"/>
  </g>
  <rect x="296" y="366" width="22" height="9" rx="2" fill="#ffd79a" opacity="0.8"/>

  <!-- parked jet (side profile) at right, dark against the sun -->
  <g fill="#1d1726">
    <!-- fuselage -->
    <path d="M812 520
             q34 -22 150 -24
             l210 2
             q42 1 64 12
             q14 7 0 13
             q-26 11 -64 12
             l-300 2
             q-44 -1 -60 -13
             Z"/>
    <!-- nose lift -->
    <path d="M806 522 q-18 -2 -22 6 q-2 6 8 8 l22 2 Z"/>
    <!-- tail fin -->
    <path d="M1150 512 l40 -66 q8 -12 20 -10 l10 2 l-6 84 Z"/>
    <!-- tailplane -->
    <path d="M1176 514 l46 -10 l2 8 l-40 12 Z"/>
    <!-- swept wing -->
    <path d="M980 534 l120 36 l54 0 l-96 -42 Z"/>
    <!-- engine -->
    <ellipse cx="1006" cy="544" rx="26" ry="13"/>
  </g>
  <!-- cabin windows -->
  <g fill="#ffcf92" opacity="0.6">
    <circle cx="900" cy="516" r="2.4"/>
    <circle cx="918" cy="516" r="2.4"/>
    <circle cx="936" cy="516" r="2.4"/>
    <circle cx="954" cy="516" r="2.4"/>
    <circle cx="972" cy="516" r="2.4"/>
    <circle cx="990" cy="516" r="2.4"/>
    <circle cx="1008" cy="516" r="2.4"/>
    <circle cx="1026" cy="516" r="2.4"/>
    <circle cx="1044" cy="516" r="2.4"/>
    <circle cx="1062" cy="516" r="2.4"/>
  </g>
  <!-- jet bridge -->
  <path d="M958 500 l-70 -2 l0 22 l70 -2 Z" fill="#2c2438"/>

  <!-- apron / ground -->
  <rect x="0" y="560" width="1440" height="200" fill="url(#apron)"/>
  <!-- sun reflection on the apron -->
  <rect x="930" y="560" width="120" height="170" fill="url(#reflect)"/>

  <!-- receding taxiway edge lights -->
  <g fill="#ffd684">
    <ellipse cx="250" cy="586" rx="5" ry="2.4" opacity="0.95"/>
    <ellipse cx="430" cy="606" rx="6" ry="2.8" opacity="0.9"/>
    <ellipse cx="640" cy="632" rx="7.5" ry="3.3" opacity="0.85"/>
    <ellipse cx="900" cy="666" rx="9" ry="4" opacity="0.8"/>
    <ellipse cx="1210" cy="706" rx="11" ry="4.8" opacity="0.75"/>
  </g>
  <g fill="#9fb8ff">
    <ellipse cx="360" cy="592" rx="4.5" ry="2.2" opacity="0.8"/>
    <ellipse cx="560" cy="616" rx="5.5" ry="2.6" opacity="0.75"/>
    <ellipse cx="800" cy="648" rx="7" ry="3.2" opacity="0.7"/>
  </g>

  <!-- atmospheric vignette -->
  <rect width="1440" height="760" fill="url(#vignette)"/>
</svg>
