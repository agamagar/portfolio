<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brick Jali — pattern studio</title>
<script src="p5.min.js"></script>
<style>
  :root{
    --bg: #0c0906;
    --panel: #14100c;
    --panel-2: #1c160f;
    --ink: #e9dbc8;
    --muted: #9d8b72;
    --rule: #2a221a;
    --accent: #c8703c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; height:100vh; width:100vw; }

  /* ---- control panel ---- */
  #panel{
    width: 320px;
    flex: 0 0 320px;
    height:100%;
    overflow-y:auto;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    padding: 20px 18px 40px;
  }
  #panel::-webkit-scrollbar{ width:8px; }
  #panel::-webkit-scrollbar-thumb{ background:#2c241b; border-radius:4px; }
  .brand{
    font-size: 15px; font-weight:600; letter-spacing:-0.01em; margin:0 0 2px;
  }
  .brand small{ display:block; font-weight:400; font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:0.02em; }

  .group{ margin-top: 22px; }
  .group.pieces-group{ margin-top: 18px; }
  .group > h3{
    font-size: 10px; text-transform:uppercase; letter-spacing:0.08em;
    color: var(--muted); margin:0 0 12px; font-weight:600;
  }

  /* ---- preset looks (swatch gallery) ---- */
  .pieces{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px 7px; }
  .piece{
    display:flex; flex-direction:column; align-items:stretch; gap:5px;
    padding:0; background:none; border:none; cursor:pointer;
  }
  .piece-swatch{
    display:flex; align-items:center; justify-content:center; height:36px;
    border:1px solid var(--rule); border-radius:6px; overflow:hidden;
    transition:border-color .12s, box-shadow .12s, transform .12s;
  }
  .piece-swatch svg{ width:78%; height:22px; display:block; }
  .piece-name{ font-size:9px; color:var(--muted); letter-spacing:0.01em; text-align:center; line-height:1.1; }
  .piece:hover .piece-swatch{ border-color:#6a583d; transform:translateY(-1px); }
  .piece.active .piece-swatch{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .piece.active .piece-name{ color:var(--ink); }
  .ctrl{ margin-bottom: 14px; }
  .ctrl .row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .ctrl label{ font-size:12px; color:var(--ink); }
  .ctrl .val{ font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background: var(--rule); border-radius:2px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:14px; height:14px; border-radius:50%;
    background: var(--ink); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--rule); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--ink); border:2px solid var(--panel); cursor:pointer;
  }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; }
  .seg button{
    font-family:inherit; font-size:11px; color:var(--muted);
    background: var(--panel-2); border:1px solid var(--rule); border-radius:4px;
    padding:6px 9px; cursor:pointer; flex:1 1 auto; min-width:0;
  }
  .seg button.active{ color:var(--bg); background:var(--ink); border-color:var(--ink); }
  select{
    width:100%; font-family:inherit; font-size:12px; color:var(--ink);
    background: var(--panel-2); border:1px solid var(--rule); border-radius:4px; padding:7px 8px; cursor:pointer;
  }
  input[type=color]{
    -webkit-appearance:none; appearance:none; width:34px; height:22px; padding:0;
    background:none; border:1px solid var(--rule); border-radius:4px; cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  input[type=color]::-webkit-color-swatch{ border:none; border-radius:2px; }
  .color-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .color-row span{ font-size:12px; color:var(--ink); }

  .actions{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .btn{
    font-family:inherit; font-size:12px; font-weight:500; text-align:center;
    padding:10px; border-radius:5px; cursor:pointer; border:1px solid var(--rule);
    background: var(--panel-2); color:var(--ink);
  }
  .btn.primary{ background: var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost{ background:none; color:var(--muted); }
  .btn:hover{ filter:brightness(1.08); }

  /* ---- stage ---- */
  #stage{ flex:1 1 auto; position:relative; min-width:0; background:#000; }
  #stage canvas{ display:block; }
  #hint{
    position:absolute; left:16px; bottom:14px; font-size:11px; color:rgba(255,255,255,0.32);
    pointer-events:none; letter-spacing:0.02em;
  }
  #back{
    position:absolute; left:16px; top:14px; z-index:5;
    font-size:12px; color:var(--muted); text-decoration:none;
    background: rgba(20,16,12,0.7); border:1px solid var(--rule); border-radius:5px;
    padding:7px 11px; backdrop-filter: blur(6px);
  }
  #back:hover{ color:var(--ink); }
</style>
</head>
<body>
  <div id="app">
    <aside id="panel">
      <div class="brand">Brick jali — pattern studio<small>One brick module, laid in a perfect-overlap grid. Every property is live.</small></div>
      <div id="controls"></div>
    </aside>
    <main id="stage">
      <a id="back" href="/">← Portfolio</a>
      <div id="hint">Drag the canvas to orbit · patterns are pure depth on a zero-gap grid</div>
    </main>
  </div>
  <script src="editor.js"></script>
</body>
</html>
