<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Away Design System — Docs</title>
<style>
  :root{
    --bg:#0b0b14; --bg-1:#0f0f1a; --bg-2:#13131f; --bg-3:#1c222f; --bg-4:#263040;
    --text:#e7ebf3; --text-2:#9aa5b8; --text-3:#657089; --text-4:#455066;
    --border:#202634; --border-2:#2c3648;
    --acc:#8b7bff; --acc-2:#6d5cf0; --acc-soft:rgba(139,123,255,.13); --acc-line:rgba(139,123,255,.4);
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --acc-on:#0b0b14; --acc-soft2:rgba(139,123,255,.16);
    --code-bg:#0c0c16;
    --nav-h:56px; --side-w:270px; --toc-w:220px;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:10px;
  }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-1:#fbfbfd; --bg-2:#f6f7f9; --bg-3:#eef0f4; --bg-4:#e4e7ee;
    --text:#15161c; --text-2:#565b69; --text-3:#8a91a1; --text-4:#aab0be;
    --border:#eaecf1; --border-2:#dfe2e9;
    --acc:#5b4bd6; --acc-2:#6d5cf0; --acc-soft:rgba(109,92,240,.09); --acc-line:rgba(109,92,240,.35); --acc-on:#ffffff; --acc-soft2:rgba(109,92,240,.12);
    --code-bg:#0c0c16;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:15px}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--acc-soft)}
  code{font-family:var(--mono);font-size:.86em}

  /* ---- top nav ---- */
  .nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:40;display:flex;align-items:center;gap:16px;
    padding:0 20px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:15px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--acc-2),#3b2fb0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
  .ver{font-size:11px;font-weight:600;color:var(--acc);background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:999px;padding:2px 8px}
  .nav-search{flex:1;max-width:440px;margin:0 auto;position:relative}
  .nav-search input{width:100%;height:36px;border-radius:9px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    font:inherit;font-size:13.5px;padding:0 36px 0 32px;outline:none}
  .nav-search input:focus{border-color:var(--acc-line)}
  .nav-search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
  .nav-search .kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px/1 var(--mono);color:var(--text-3);
    background:var(--bg-3);border:1px solid var(--border-2);border-radius:5px;padding:3px 6px}
  .nav-right{display:flex;align-items:center;gap:6px}
  .nav-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;border:1px solid transparent}
  .nav-btn:hover{background:var(--bg-2);color:var(--text)}
  .nav-btn svg{width:17px;height:17px}

  /* ---- shell ---- */
  .shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--toc-w);max-width:1400px;margin:0 auto;padding-top:var(--nav-h)}
  .side{position:sticky;top:var(--nav-h);align-self:start;height:calc(100vh - var(--nav-h));overflow-y:auto;padding:24px 14px 60px 20px;border-right:1px solid var(--border)}
  .side::-webkit-scrollbar,.toc::-webkit-scrollbar{width:7px}
  .side::-webkit-scrollbar-thumb,.toc::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px}
  .grp{margin-bottom:22px}
  .grp-t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:0 10px;margin-bottom:8px}
  .nav-i{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--text-2);font-size:13.5px;cursor:pointer;position:relative}
  .nav-i:hover{background:var(--bg-2);color:var(--text)}
  .nav-i.active{color:var(--acc);background:var(--acc-soft);font-weight:550}
  .nav-i .tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--bg-3);color:var(--text-3)}
  .nav-i .tag.free{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
  .nav-i .tag.new{color:var(--acc);background:var(--acc-soft)}

  /* ---- main ---- */
  .main{min-width:0;padding:44px 56px 120px;max-width:820px}
  .crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:14px;display:flex;gap:7px;align-items:center}
  .crumbs b{color:var(--text-2);font-weight:500}
  h1{font-size:32px;font-weight:680;letter-spacing:-.02em;margin:0 0 12px}
  .lead{font-size:16.5px;color:var(--text-2);margin:0 0 28px;line-height:1.65}
  h2{font-size:21px;font-weight:640;letter-spacing:-.01em;margin:40px 0 12px;scroll-margin-top:80px;padding-top:4px}
  h3{font-size:16px;font-weight:620;margin:26px 0 8px;scroll-margin-top:80px}
  .page p{color:var(--text-2);margin:0 0 14px}
  .page p b,.page li b{color:var(--text);font-weight:600}
  .page ul{color:var(--text-2);padding-left:20px;margin:0 0 16px}
  .page li{margin:5px 0}
  .page a.link{color:var(--acc);border-bottom:1px solid var(--acc-line)}
  hr{border:0;border-top:1px solid var(--border);margin:36px 0}

  /* code */
  .code{position:relative;background:var(--code-bg);border:1px solid var(--border-2);border-radius:var(--r);margin:0 0 18px;overflow:hidden}
  .code-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:#8b93a7}
  .code-h .dot{width:9px;height:9px;border-radius:50%;background:#2c3546}
  .code pre{margin:0;padding:16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;color:#c7d0e0}
  .code .cp{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;color:#8b93a7;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:5px 9px;cursor:pointer}
  .code .cp:hover{color:#fff}
  .tok-k{color:#c792ea}.tok-s{color:#c3e88d}.tok-c{color:#5c6473;font-style:italic}.tok-f{color:#82aaff}.tok-n{color:#f78c6c}

  /* callout */
  .cal{display:flex;gap:12px;border:1px solid var(--border-2);border-left:3px solid var(--acc);border-radius:var(--r);padding:14px 16px;margin:0 0 18px;background:var(--acc-soft)}
  .cal .ic{color:var(--acc);flex:none;margin-top:1px}
  .cal.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}.cal.warn .ic{color:var(--warn)}
  .cal .b{font-size:14px;color:var(--text-2)}.cal .b b{color:var(--text)}

  /* cards */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
  .card{border:1px solid var(--border);border-radius:var(--r);padding:16px;background:var(--bg-1);transition:border-color .15s,transform .15s;cursor:pointer}
  .card:hover{border-color:var(--acc-line);transform:translateY(-2px)}
  .card .t{font-weight:620;font-size:14.5px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
  .card .n{font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:4px;padding:1px 6px}
  .card .d{font-size:13px;color:var(--text-3)}

  /* prop table */
  .tbl-wrap{border:1px solid var(--border);border-radius:var(--r);overflow-x:auto;margin:0 0 20px}
  .tbl-wrap table{min-width:560px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-weight:600;color:var(--text-3);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;background:var(--bg-2);border-bottom:1px solid var(--border)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2)}
  tbody tr:last-child td{border-bottom:0}
  td .pn{font-family:var(--mono);font-size:12.5px;color:var(--acc);font-weight:500}
  td .pt{font-family:var(--mono);font-size:12px;color:var(--text-3)}
  td .pd{font-family:var(--mono);font-size:12px;color:var(--text-3);background:var(--bg-3);border-radius:4px;padding:1px 5px}

  /* preview box */
  .prev{border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;padding:28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;background:
    radial-gradient(circle at 1px 1px, var(--bg-3) 1px, transparent 0) 0 0/18px 18px;border-bottom:0}
  .prev{position:relative;overflow:hidden}
  .prev + .code{border-radius:0 0 var(--r) var(--r);margin-top:0;border-top-left-radius:0;border-top-right-radius:0}
  .demo-btn{height:40px;padding:0 16px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .swz{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:0 0 8px}
  .swz i{aspect-ratio:1;border-radius:6px;position:relative;border:1px solid rgba(255,255,255,.06)}

  /* toc */
  .toc{position:sticky;top:var(--nav-h);align-self:start;height:calc(100vh - var(--nav-h));overflow-y:auto;padding:44px 20px 60px;font-size:13px}
  .toc-t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
  .toc a{display:block;color:var(--text-3);padding:5px 0 5px 12px;border-left:1.5px solid var(--border);line-height:1.4}
  .toc a:hover{color:var(--text-2)}
  .toc a.active{color:var(--acc);border-left-color:var(--acc)}
  .toc a.sub{padding-left:24px;font-size:12.5px}

  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;border-top:1px solid var(--border);padding-top:24px}
  .pager a{flex:1;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer}
  .pager a:hover{border-color:var(--acc-line)}
  .pager .l{font-size:12px;color:var(--text-3)}
  .pager .n{font-size:14.5px;font-weight:600;color:var(--text);margin-top:2px}
  .pager .r{text-align:right}


  /* ---- live preview widgets (theme-aware) ---- */
  .dw{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;font-family:var(--sans)}
  .dw-col{flex-direction:column;align-items:stretch;gap:10px;width:100%;max-width:340px}
  .db{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;user-select:none;transition:transform .1s,filter .12s}
  .db:active{transform:scale(.97)} .db:hover{filter:brightness(1.08)}
  .db.solid{background:var(--acc);color:var(--acc-on)} .db.soft{background:var(--acc-soft2);color:var(--acc)}
  .db.outline{background:transparent;color:var(--acc);border-color:var(--acc-line)} .db.ghost{background:transparent;color:var(--acc)}
  .db.ok{background:var(--ok);color:#06210f} .db.bad{background:var(--bad);color:#2b0708} .db.sm{height:32px;font-size:13px;border-radius:8px;padding:0 12px}
  .dchip{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--border-2);color:var(--text-2);background:transparent;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .dchip.on{background:var(--acc);color:var(--acc-on);border-color:transparent}
  .dsw{width:44px;height:26px;border-radius:13px;background:var(--bg-4);position:relative;cursor:pointer;flex:none}
  .dsw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .16s}
  .dsw.on{background:var(--acc)} .dsw.on i{left:21px}
  .dchk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;color:var(--acc-on);cursor:pointer}
  .dchk.on{background:var(--acc);border-color:var(--acc)}
  .drad{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .drad.on{border-color:var(--acc)} .drad.on i{width:10px;height:10px;border-radius:5px;background:var(--acc)}
  .drow{display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px;cursor:pointer}
  .dstep{display:flex;align-items:center;gap:14px}
  .dstep b{width:34px;height:34px;border-radius:17px;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font-weight:400;user-select:none}
  .dstep b:active{transform:scale(.94)} .dstep .v{min-width:22px;text-align:center;font-weight:600;color:var(--text)}
  .dstar{font-size:28px;cursor:pointer;user-select:none;line-height:1}
  .dsl{position:relative;height:40px;width:100%;max-width:320px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .dsl .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--bg-4)}
  .dsl .fl{position:absolute;left:0;height:4px;border-radius:2px;background:var(--acc)}
  .dsl .th{position:absolute;width:22px;height:22px;border-radius:11px;background:var(--acc);border:3px solid var(--bg);transform:translateX(-11px)}
  .dseg{display:inline-flex;background:var(--bg-3);border-radius:999px;padding:4px}
  .dseg span{padding:9px 16px;border-radius:999px;font-size:13px;color:var(--text-3);cursor:pointer;user-select:none}
  .dseg span.on{background:var(--bg);color:var(--acc);font-weight:600}
  .dtabs{display:flex;gap:22px;border-bottom:1px solid var(--border);position:relative;width:100%}
  .dtabs span{padding:11px 0;font-size:14px;color:var(--text-3);cursor:pointer;user-select:none} .dtabs span.on{color:var(--text);font-weight:600}
  .dtabs .ind{position:absolute;bottom:0;height:2px;border-radius:1px;background:var(--acc);transition:all .18s;left:0}
  .dotp{display:flex;gap:8px;position:relative}
  .dotp .c{width:44px;height:52px;border-radius:10px;border:1px solid var(--border-2);background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--text)}
  .dotp .c.act{border:2px solid var(--acc)} .dotp input{position:absolute;inset:0;opacity:0}
  .dprog{width:100%;max-width:320px} .dprog .tk{height:6px;border-radius:3px;background:var(--bg-4);overflow:hidden;cursor:pointer} .dprog .fi{height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
  .dcard{border:1px solid var(--border);border-radius:12px;background:var(--bg-2);padding:14px;width:100%;max-width:320px}
  .dtoastwrap{position:absolute;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .dtoast{width:88%;max-width:320px;display:flex;gap:12px;background:var(--bg-3);border:1px solid var(--border-2);border-left:3px solid var(--ok);border-radius:10px;padding:12px 14px;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:dtin .25s}
  @keyframes dtin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .dov{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:10px;display:flex;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
  .dov.show{opacity:1;pointer-events:auto}
  .dsheet{margin-top:auto;width:100%;background:var(--bg-2);border-radius:14px 14px 0 0;padding:8px 18px 22px;transform:translateY(40px);transition:transform .22s}
  .dov.show .dsheet{transform:none}
  .ddlg{margin:auto;width:min(360px,86%);background:var(--bg-2);border-radius:14px;padding:20px;transform:scale(.95);transition:transform .18s} .dov.show .ddlg{transform:scale(1)}
  .dgrab{width:36px;height:4px;border-radius:2px;background:var(--bg-4);margin:0 auto 12px}
  .dspin{width:20px;height:20px;border-radius:50%;border:2px solid var(--bg-4);border-top-color:var(--acc);animation:dspin .8s linear infinite} @keyframes dspin{to{transform:rotate(360deg)}}
  .dskel{background:var(--bg-3);border-radius:8px;animation:dpulse 1.4s ease-in-out infinite} @keyframes dpulse{0%,100%{opacity:.55}50%{opacity:1}}
  /* agent (fixed light/indigo) */
  .ag{--a-s:#fff;--a-o:#f4f4f7;--a-t:#17171f;--a-2:#52525e;--a-3:#8a8a96;--a-st:#e6e6ec;--a-ac:#6d5cf0;--a-acs:#5847d6;--a-am:#cec7fb;--a-af:#eeeaf5;--a-ct:#17171f;font-family:var(--sans)}
  .ag-card{background:var(--a-s);border:1px solid var(--a-st);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:16px 12px 12px;width:300px}
  .ag-rnd{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--a-o);color:var(--a-t);cursor:pointer} .ag-rnd.dk{background:var(--a-ct);color:#fff}
  .ag-in{border:0;background:transparent;outline:none;width:100%;font:inherit;font-weight:300;font-size:14px;color:var(--a-t);padding:4px 6px} .ag-in::placeholder{color:var(--a-2)}
  .ag-act{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:16px}
  .ag-send{height:36px;min-width:60px;border-radius:999px;background:#e6e6ec;color:#c2c2ca;display:flex;align-items:center;justify-content:center;cursor:default} .ag-send.on{background:var(--a-ct);color:#fff;cursor:pointer}
  .ag-ctx{color:var(--a-2);font-size:13px;font-weight:300;flex:1}
  .ag-cal{width:300px} .ag-cal .h,.ag-cal .w{display:grid;grid-template-columns:repeat(7,1fr)} .ag-cal .h span{text-align:center;font-size:11px;color:var(--a-3);padding-bottom:6px} .ag-cal .h span.we{color:var(--a-ac)}
  .ag-cal .d{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:6px;color:var(--a-t);font-size:13px;cursor:pointer} .ag-cal .d small{font-size:9px} .ag-cal .d.rg{background:var(--a-af)} .ag-cal .d.en{background:var(--a-ac);color:#fff} .ag-cal .d.mut{color:#c2c2ca}
  .ag-bars{display:flex;align-items:flex-end;gap:3px;height:90px;width:280px} .ag-bars i{flex:1;border-radius:2px;background:var(--a-af)} .ag-bars i.on{background:var(--a-ac)}
  @keyframes chd{0%,60%,100%{opacity:.4;transform:none}30%{opacity:1;transform:translateY(-3px)}}
  .hidden{display:none!important}
  .side-toggle{display:none}
  @media(max-width:1180px){ :root{--toc-w:0px} .toc{display:none} .shell{grid-template-columns:var(--side-w) 1fr} }
  @media(max-width:860px){
    .shell{grid-template-columns:1fr} .main{padding:28px 20px 100px}
    .side{position:fixed;top:var(--nav-h);left:0;bottom:0;width:280px;background:var(--bg);z-index:35;transform:translateX(-100%);transition:transform .2s;border-right:1px solid var(--border)}
    html.side-open .side{transform:none}
    .side-toggle{display:flex} .nav-search{max-width:none}
  }
</style>
</head>
<body>
  <header class="nav">
    <div class="nav-btn side-toggle" id="side-toggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </div>
    <a class="brand" data-nav="introduction"><span class="mark">A</span>Away DS<span class="ver">v0.3.0</span></a>
    <div class="nav-search">
      <span class="si">⌕</span>
      <input id="search" type="text" placeholder="Search documentation" autocomplete="off" />
      <span class="kbd">/</span>
    </div>
    <div class="nav-right">
      <a class="nav-btn" href="https://www.npmjs.com/package/@agamagar/away-design-system" target="_blank" title="npm" aria-label="npm">

  introduction:{title:'Introduction',crumb:'Getting Started',html:function(){return ''
    +'<p class="lead">A production-ready React Native design system for the Away travel app — theme tokens, a 40-component base layer, an AI-agent chat kit, and the concierge component kit. Built on Expo + Unistyles v3, typed, and accessible by default.</p>'

    +'<h2 id="whats-included">What’s included</h2>'
    +'<div class="cards">'
      +'<div class="card" data-nav="colors"><div class="t">Theme &amp; tokens</div><div class="d">3 themes (light · dark · away), 12 color ramps, semantic tokens, and the agent/indigo layer.</div></div>'
      +'<div class="card" data-nav="button"><div class="t">Base <span class="n">40</span></div><div class="d">Buttons, forms, surfaces, navigation, overlays, feedback — one variant contract.</div></div>'
      +'<div class="card" data-nav="message-bubble"><div class="t">Chat kit <span class="n">12</span></div><div class="d">Bubbles, streaming text, tool-call cards, composer — the AI-agent surface.</div></div>'
      +'<div class="card" data-nav="agent-input-bar"><div class="t">Agent kit <span class="n">16 + 6</span></div><div class="d">The concierge + search components and full standalone screens.</div></div>'
    +'</div>'
    +'<h2 id="the-idea">The one idea</h2>'
    +'<p>Every component resolves its colors, sizes, and type through a single <b>foundation contract</b> — <code>Tone × Variant × Size</code>. Re-accent the system in one file (<code>foundation.ts</code>) and every button, chip, bubble, and pill updates. No component-by-component restyling, no drift.</p>'
    +codeBlock("import { Button, resolveVariant } from '@agamagar/away-design-system';\n\n// A built-in\n<Button label=\"Search flights\" tone=\"accent\" variant=\"solid\" />\n\n// A custom component that stays on-system\nconst v = resolveVariant(theme, 'soft', 'success');")
    +'<h2 id="principles">Principles</h2>'
    +'<ul>'
      +'<li><b>Precise &amp; token-driven</b> — no hardcoded hex, spacing, or radii; everything reads the theme.</li>'
      +'<li><b>Accessible by default</b> — 44pt targets, roles + labels, adjustable controls, live regions, reduce-motion-friendly.</li>'

  installation:{title:'Installation',crumb:'Getting Started',html:function(){return ''

  theming:{title:'Theming',crumb:'Getting Started',html:function(){return ''
    +'<p class="lead">The system is driven by one contract. Change the accent, resize controls, or retune type in a single file and every component follows.</p>'
    +'<h2 id="themes">Themes</h2>'
    +'<p>Three themes are registered: <b>light</b>, <b>dark</b>, and <b>away</b> (the shipped dark-navy brand theme). All share the same shape — <code>{ colors, spacing, radius, typography }</code> — so the same token indices work everywhere.</p>'

    +'<h2 id="reaccent">Re-accenting the system</h2>'
    +'<p>The accent ramp is set in one place. Point it at a different ramp and every accent control — buttons, chips, tabs, chat bubbles, agent pills — re-skins together.</p>'
    +codeBlock("// foundation.ts — resolveTone()\nconst ramp = {\n  accent: theme.colors.mysticBlue, // ← change this line\n  success: theme.colors.fuanaGreen,\n  …\n}[tone];")
    +'<h2 id="custom">Custom components</h2>'
    +'<p>Build your own on the same rails by importing the resolvers — spacing, tone, and sizing stay consistent with the built-ins.</p>'
    +codeBlock("import { useUnistyles } from 'react-native-unistyles';\nimport { resolveTone, CONTROL_SIZES } from '@agamagar/away-design-system';\n\nfunction PriceTag({ tone = 'accent' }) {\n  const { theme } = useUnistyles();\n  const t = resolveTone(theme, tone);\n  return <View style={{ backgroundColor: t.soft, borderRadius: CONTROL_SIZES.sm.radius }}>…</View>;\n}");}},

  colors:{title:'Color',crumb:'Foundations',html:function(){return ''

/* ---------------- render a page ---------------- */
function componentHTML(c){
  var h='<p class="lead">'+c.desc+'</p>';
  var hasDemo=!!DEMOS[c.id];
  if(hasDemo) h+='<div class="prev" data-demo="'+c.id+'"></div>';
  else if(c.preview) h+=previewHTML(c.preview);
  if(c.extra) h+=c.extra;
  if(c.code) h+=((hasDemo||c.preview)?'':'<h2 id="usage">Usage</h2>')+codeBlock(c.code);
  if(c.props){ h+='<h2 id="props">Props</h2>'+propTable(c.props); }
  return h;
}
function render(id){
  id=id||'introduction'; if(!CMAP[id] && !PAGES[id]) id='introduction';
  var main=$('#main'), title, crumb, body;
  if(PAGES[id]){ title=PAGES[id].title; crumb=PAGES[id].crumb; body=PAGES[id].html(); }
  else { var c=CMAP[id]; title=c.label; crumb=c.group; body=componentHTML(c); }
  main.innerHTML='<div class="crumbs"><b>'+crumb+'</b><span>/</span>'+title+'</div><h1>'+title+'</h1><div class="page">'+body+'</div>'+pager(id);
  // dynamic token blocks
  if(id==='colors') paintColors();
  if(id==='typography') paintTypes();
  if(id==='spacing') paintScales();
  main.scrollTop=0; window.scrollTo(0,0);
  $$('.nav-i').forEach(function(el){ el.classList.toggle('active', el.dataset.nav===id); });
  var act=$('.nav-i.active'); if(act) act.scrollIntoView({block:'nearest'});
  $$('[data-demo]').forEach(function(box){ var b=DEMOS[box.dataset.demo]; if(b){ try{ box.appendChild(b()); }catch(e){ if(window.console)console.error('demo',box.dataset.demo,e); } } });
  buildTOC(); wireCopy();
  location.hash='#/'+id;
  document.title=title+' — Away DS';
  document.documentElement.classList.remove('side-open');
}
function pager(id){
  var i=FLAT.indexOf(id); if(i<0) return '';
  var prev=FLAT[i-1], next=FLAT[i+1];
  var label=function(x){ return CMAP[x]?CMAP[x].label:(PAGES[x]?PAGES[x].title:x); };
  var l=prev?'<a data-nav="'+prev+'"><div class="l">Previous</div><div class="n">'+label(prev)+'</div></a>':'<span></span>';
  var r=next?'<a class="r" data-nav="'+next+'"><div class="l">Next</div><div class="n">'+label(next)+'</div></a>':'<span></span>';
  return '<div class="pager">'+l+r+'</div>';
}

}
function paintScales(){
  var sp=$('#space-doc'); if(sp) sp.innerHTML='<div class="tbl-wrap"><table><thead><tr><th>Token</th><th>px</th><th></th></tr></thead><tbody>'+SPACES.map(function(s){return '<tr><td><span class="pn">'+s[0]+'</span></td><td><span class="pt">'+s[1]+'</span></td><td><div style="height:14px;width:'+(s[1]*3)+'px;background:var(--acc);border-radius:3px;opacity:.85"></div></td></tr>';}).join('')+'</tbody></table></div>';
  var rd=$('#radius-doc'); if(rd) rd.innerHTML='<div class="prev" style="border-radius:10px;border-bottom:1px solid var(--border);gap:20px">'+RADII.map(function(r){var v=r[1]>100?28:r[1];return '<div style="text-align:center"><div style="width:60px;height:60px;background:var(--bg-4);border:1px solid var(--border-2);border-radius:'+v+'px"></div><div style="font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:6px">'+r[0]+' · '+(r[1]>100?'999':r[1])+'</div></div>';}).join('')+'</div>';
}

/* ---------------- TOC ---------------- */
var tocLinks=[];
function buildTOC(){
  var heads=$$('#main h2, #main h3');
  var toc=$('#toc');
  if(!heads.length){ toc.innerHTML=''; return; }
  toc.innerHTML='<div class="toc-t">On this page</div>'+heads.map(function(h){
    if(!h.id) h.id=h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    return '<a href="#'+h.id+'" class="'+(h.tagName==='H3'?'sub':'')+'" data-h="'+h.id+'">'+h.textContent+'</a>';
  }).join('');
  tocLinks=$$('#toc a');
  $$('#toc a').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); var t=document.getElementById(a.dataset.h); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }); });
}
function onScroll(){
  if(!tocLinks.length) return;
  var y=window.scrollY+90, cur=null;
  $$('#main h2, #main h3').forEach(function(h){ if(h.offsetTop<=y) cur=h.id; });
  tocLinks.forEach(function(a){ a.classList.toggle('active', a.dataset.h===cur); });
}

/* ---------------- copy buttons ---------------- */
function wireCopy(){ $$('[data-copy]').forEach(function(b){ b.addEventListener('click',function(){ var pre=b.parentNode.querySelector('pre'); try{ navigator.clipboard.writeText(pre.innerText); }catch(e){} var o=b.textContent; b.textContent='Copied ✓'; setTimeout(function(){b.textContent=o},1200); }); }); }

/* ---------------- search ---------------- */
function wireSearch(){
  var inp=$('#search');
  inp.addEventListener('input',function(){
    var q=inp.value.trim().toLowerCase();
    $$('.grp').forEach(function(g){
      var any=false;
      $$('.nav-i',g).forEach(function(i){ var m=!q||i.textContent.toLowerCase().indexOf(q)>-1; i.classList.toggle('hidden',!m); if(m) any=true; });
      g.classList.toggle('hidden',!any);
    });
  });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var first=$('.nav-i:not(.hidden)'); if(first){ render(first.dataset.nav); inp.value=''; inp.dispatchEvent(new Event('input')); inp.blur(); } } if(e.key==='Escape'){ inp.value=''; inp.dispatchEvent(new Event('input')); inp.blur(); } });
  document.addEventListener('keydown',function(e){ if(e.key==='/' && document.activeElement!==inp){ e.preventDefault(); inp.focus(); } });
}

/* ---------------- theme ---------------- */
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){ document.documentElement.setAttribute('data-theme',t); $('#theme-toggle').innerHTML=t==='dark'?SUN:MOON; try{localStorage.setItem('awaydocs-theme',t)}catch(e){} }

/* ---------------- boot ---------------- */
renderSide();
wireSearch();
$('#theme-toggle').addEventListener('click',function(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); });
try{ var qp=new URLSearchParams(location.search).get('theme'); var saved=localStorage.getItem('awaydocs-theme'); setTheme(qp||saved||'dark'); }catch(e){ setTheme('dark'); }
window.addEventListener('message',function(e){ if(e.data && e.data.type==='theme' && (e.data.value==='dark'||e.data.value==='light')) setTheme(e.data.value); });
$('#side-toggle').addEventListener('click',function(){ document.documentElement.classList.toggle('side-open'); });
document.addEventListener('click',function(e){ var n=e.target.closest('[data-nav]'); if(n){ e.preventDefault(); render(n.dataset.nav); } });
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('hashchange',function(){ var id=location.hash.replace('#/',''); if(id && id!==currentId()) render(id); });
function currentId(){ return (location.hash.replace('#/','')||'introduction'); }
render((location.hash.replace('#/','')) || 'introduction');
</script>
</body>
</html>
