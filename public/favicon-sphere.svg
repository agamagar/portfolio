<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The first frame of the tab icon's run (src/lib/favicon3d.js: red sphere, yellow pyramid,
       blue cube, the face): the red sphere, so what shows before the animation starts, under
       reduced motion, in Safari or without WebGL2 is the same icon the animation begins with.
       Colours sampled from the shader's own render of that frame. -->
  <defs>
    <radialGradient id="s" cx="0.4" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#f1aeaa" />
      <stop offset="0.28" stop-color="#d9605a" />
      <stop offset="0.62" stop-color="#c7544f" />
      <stop offset="1" stop-color="#812a27" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="14.2" fill="url(#s)" />
</svg>
