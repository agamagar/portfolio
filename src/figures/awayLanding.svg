<svg viewBox="0 0 360 780" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" class="fig-svg fig-svg--away-landing">
  <defs>
    <linearGradient id="awayCardG" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2A2063" />
      <stop offset="0.55" stop-color="#171231" />
      <stop offset="1" stop-color="#0C0A18" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="360" height="780" fill="#0B0B14" />

  <text class="fig-greeting" x="180" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500"><tspan fill="#7E6BEA">Hey </tspan><tspan fill="#E2E8F0">Sukesh</tspan></text>
  <text class="fig-heading" x="180" y="152" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#E2E8F0">Where are you going?</text>

  <g class="fig-search">
    <rect x="20" y="255" width="320" height="120" rx="18" fill="#13131F" stroke="#5747C9" stroke-width="1.5" />
    <text x="36" y="293" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6B7080">Search for a city, flight type or fare</text>
    <g class="fig-arrow">
      <circle cx="308" cy="350" r="21" fill="#E6EAF1" />
      <path d="M308 361 V340 M300 348 L308 340 L316 348" fill="none" stroke="#11111B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <g class="fig-card">
    <rect x="20" y="405" width="320" height="110" rx="18" fill="url(#awayCardG)" />
    <g transform="rotate(-9 82 468)">
      <rect x="50" y="430" width="64" height="80" rx="11" fill="#16171F" stroke="#2B2D3B" stroke-width="1" />
      <rect x="56" y="438" width="52" height="64" rx="6" fill="#0E0F18" />
    </g>
    <g transform="rotate(-3 80 470)">
      <rect x="40" y="452" width="86" height="32" rx="6" fill="#F3F4F6" />
      <rect x="47" y="460" width="22" height="3.5" rx="1.5" fill="#9AA0AC" />
      <rect x="47" y="467" width="14" height="3" rx="1.5" fill="#C2C6CF" />
      <text x="119" y="473" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10111A">₹6,206</text>
    </g>
    <text x="150" y="446" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#E6EAF1">Have a flight in mind?</text>
    <text x="150" y="465" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#E6EAF1">We'll find a better price</text>
    <g class="fig-upload">
      <rect x="150" y="481" width="150" height="30" rx="15" fill="#1C222F" />
      <text x="225" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#C9CDD6">Upload screenshot</text>
    </g>
  </g>

  <g class="fig-footer">
    <g transform="translate(180 670)">
      <circle r="13" fill="none" stroke="#23242F" stroke-width="1" />
      <path d="M-4 0 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#9094A4" stroke-width="1.4" stroke-linecap="round" />
      <rect x="-6" y="0" width="12" height="9" rx="2" fill="#9094A4" />
      <circle cx="0" cy="4.5" r="1.1" fill="#13131F" />
    </g>
    <text x="180" y="708" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7080">Away is invite only, you have limited access</text>
    <text x="180" y="731" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#ACB0B8">Got an invite code?</text>
  </g>
</svg>
