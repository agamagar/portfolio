<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board lab</title>
<style>
  :root { --bg:#f4f2ec; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e2dfd6; --accent:#0b8a6c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14150f; --panel:#1c1d16; --ink:#ecebe4; --muted:#9a9889; --line:#2b2c23; --accent:#4fd1a8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  .lab { display:grid; grid-template-columns: 340px minmax(0,1fr); gap:20px; padding:16px; min-height:100vh; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; position:sticky; top:16px; }
  h1 { margin:0; font-size:15px; font-weight:600; }
  label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
  select, input, textarea, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  textarea { height:300px; resize:vertical; font:12px/1.5 ui-monospace,Menlo,monospace; white-space:pre; }
  button { cursor:pointer; background:var(--panel); }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .stage { display:grid; gap:12px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 1px 0 var(--line), 0 24px 60px -30px rgba(20,16,45,.45); overflow:hidden; }
  .scrub { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12px; }
  .scrub input { flex:1; accent-color:var(--accent); padding:0; }
  .err { color:#d63b3b; white-space:pre-wrap; font:12px ui-monospace,monospace; }
  body.bare .panel, body.bare .scrub { display:none; } body.bare .lab { grid-template-columns:1fr; padding:0; } body.bare .card { border-radius:0; box-shadow:none; }
  @media (max-width: 860px) { .lab { grid-template-columns:1fr; } .panel { position:static; } }
</style>
</head>
<body>
<main class="lab">
  <aside class="panel">
    <h1>Board engine lab</h1>
    <label>Layout <select id="layout"></select></label>
    <label>Content <textarea id="input" spellcheck="false"></textarea></label>
    <div class="row">
      <label style="flex:1">Seed <input id="seed" value=""></label>
      <label style="flex:1">Pace <input id="pace" type="range" min="0.5" max="3" step="0.1" value="1"></label>
    </div>
    <div class="row">
      <button class="primary" id="replay">Replay</button>
      <button id="finish">Finish</button>
      <button id="svg">Export SVG</button>
      <button id="png">Export PNG</button>
    </div>
    <div class="row">
      <label style="flex:1">Annotate your own image <input id="file" type="file" accept="image/*"></label>
    </div>
    <small style="color:var(--muted)">On "Annotate a screenshot": click the image to drop a note, then edit its text in the JSON.</small>
    <div class="err" id="err" role="alert"></div>
  </aside>
  <section class="stage">
    <div class="card"><div id="board"></div></div>
    <div class="scrub"><span id="time">0.0s</span><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline"><span id="dur"></span></div>
  </section>
</main>
<script type="module" src="./lab.js"></script>
</body>
</html>
